[project]
name = "chess-mcp-server"
version = "0.1.0"
description = "MCP server for chess move computation using UCI engines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.12.4",
    "pydantic>=2.0.0",
    "pyseto>=1.8.5",
    "python-chess>=1.999",
    "pyyaml>=6.0.2",
    "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
