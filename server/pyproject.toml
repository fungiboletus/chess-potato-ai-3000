[project]
name = "chess-mcp-server"
version = "0.1.0"
description = "MCP server for chess move computation using UCI engines"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "async-lru>=2.3.0",
    "fastmcp>=3.1.1",
    "pydantic>=2.12.5",
    "pyseto>=1.9.1",
    "python-chess>=1.999",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.42.0",
    "wsproto>=1.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.7",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
