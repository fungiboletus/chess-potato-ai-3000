apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chess-potato-ai-3000-lichess.configSecretName" . }}
  labels:
    {{- include "chess-potato-ai-3000-lichess.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.model.ollama.bearerToken }}
  OLLAMA_BEARER_TOKEN: {{ .Values.model.ollama.bearerToken | quote }}
  {{- end }}
  config.yaml: |
    token: {{ .Values.secrets.lichessToken | quote }}
    url: {{ .Values.config.url | quote }}

    engine:
      dir: "./engines/"
      name: {{ .Values.config.engineName | quote }}
      working_dir:
        {{ .Values.config.workingDir | quote }}
      protocol: "uci"
      ponder: false
      polyglot:
        enabled: false
      draw_or_resign:
        resign_enabled: false
        offer_draw_enabled: true
        offer_draw_score: 0
        offer_draw_moves: 10
        offer_draw_pieces: 10
      online_moves:
        max_out_of_book_moves: 10
        max_retries: 2
        chessdb_book:
          enabled: false
        lichess_cloud_analysis:
          enabled: false
        lichess_opening_explorer:
          enabled: false
        online_egtb:
          enabled: false
      lichess_bot_tbs:
        syzygy:
          enabled: false
          paths:
            - "engines/syzygy"
          max_pieces: 7
          move_quality: "best"
        gaviota:
          enabled: false
          paths:
            - "engines/gaviota"
          max_pieces: 5
          min_dtm_to_consider_as_wdl_1: 120
          move_quality: "best"
      homemade_options:
      uci_options:
        MaxAttempts: 4
      silence_stderr: false

    abort_time: 30
    fake_think_time: false
    rate_limiting_delay: 0
    move_overhead: 2000
    max_takebacks_accepted: 0
    quit_after_all_games_finish: false

    correspondence:
      move_time: 60
      checkin_period: 300
      disconnect_time: 150
      ponder: false

    challenge:
      concurrency: {{ .Values.config.challengeConcurrency }}
      sort_by: "best"
      preference: "none"
      accept_bot: true
      only_bot: false
      max_increment: 20
      min_increment: 0
      max_base: 1800
      min_base: 0
      max_days: 14
      min_days: 1
      variants:
{{ toYaml .Values.config.challengeVariants | indent 8 }}
      time_controls:
{{ toYaml .Values.config.challengeTimeControls | indent 8 }}
      modes:
{{ toYaml .Values.config.challengeModes | indent 8 }}
      bullet_requires_increment: false
      max_simultaneous_games_per_user: 5

    greeting:
      hello: {{ .Values.config.greetingHello | quote }}
      goodbye: {{ .Values.config.greetingGoodbye | quote }}
      hello_spectators: {{ .Values.config.greetingHelloSpectators | quote }}
      goodbye_spectators: {{ .Values.config.greetingGoodbyeSpectators | quote }}

    matchmaking:
      allow_matchmaking: {{ .Values.config.matchmakingEnabled }}
      allow_during_games: false
      challenge_variant: "random"
      challenge_timeout: 1
      challenge_initial_time:
        - 60
        - 180
        - 360
      challenge_increment:
        - 5
        - 10
        - 20
      opponent_max_rating: 1200
      opponent_rating_difference: 500
      rating_preference: "high"
      opponent_allow_tos_violation: false
      challenge_mode: "rated"
      challenge_filter: none
      include_challenge_block_list: false
