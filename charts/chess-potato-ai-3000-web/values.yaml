nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

server:
  replicaCount: 1
  image:
    repository: ghcr.io/fungiboletus/chess-potato-ai-3000-server
    tag: main
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  ollama:
    endpoint: ""
    bearerToken: ""
  feedback:
    databaseUrl: ""
    databaseFilename: feedback.db
    maxBytes: 16384
    maxHistory: 256
    maxNotes: 1000
  persistence:
    enabled: true
    existingClaim: ""
    claimName: ""
    annotations: {}
    labels: {}
    selector: {}
    volumeName: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    mountPath: /app/data
    subPath: ""
  env: {}
  extraEnv: []
  secretKey: ""
  resources: {}

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/fungiboletus/chess-potato-ai-3000-frontend
    tag: main
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chess-potato-ai-3000.local
      paths:
        - path: /
          pathType: Prefix
        - path: /mcp
          pathType: Prefix
  tls: []
