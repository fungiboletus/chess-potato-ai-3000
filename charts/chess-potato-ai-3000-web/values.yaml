nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

server:
  replicaCount: 1
  image:
    repository: ghcr.io/fungiboletus/chess-potato-ai-3000-server
    tag: main
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  ollama:
    endpoint: ""
    bearerToken: ""
  env: {}
  extraEnv: []
  secretKey: ""
  resources: {}

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/fungiboletus/chess-potato-ai-3000-frontend
    tag: main
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chess-potato-ai-3000.local
      paths:
        - path: /
          pathType: Prefix
        - path: /mcp
          pathType: Prefix
  tls: []
