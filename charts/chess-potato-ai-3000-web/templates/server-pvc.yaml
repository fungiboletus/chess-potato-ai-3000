{{- if and .Values.server.persistence.enabled (not .Values.server.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chess-potato-ai-3000-web.serverPersistenceName" . }}
  labels:
    {{- include "chess-potato-ai-3000-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with .Values.server.persistence.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.server.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.server.persistence.size }}
  {{- if eq .Values.server.persistence.storageClass "-" }}
  storageClassName: ""
  {{- else if .Values.server.persistence.storageClass }}
  storageClassName: {{ .Values.server.persistence.storageClass | quote }}
  {{- end }}
  {{- with .Values.server.persistence.selector }}
  selector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.server.persistence.volumeName }}
  volumeName: {{ . | quote }}
  {{- end }}
{{- end }}