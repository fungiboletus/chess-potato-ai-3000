apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chess-potato-ai-3000-web.serverName" . }}
  labels:
    {{- include "chess-potato-ai-3000-web.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "chess-potato-ai-3000-web.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "chess-potato-ai-3000-web.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- if .Values.server.secretKey }}
            - name: CPAI3000_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "chess-potato-ai-3000-web.serverSecretName" . }}
                  key: CPAI3000_SECRET_KEY
            {{- end }}
            {{- if .Values.server.ollama.endpoint }}
            - name: OLLAMA_ENDPOINT
              value: {{ .Values.server.ollama.endpoint | quote }}
            {{- end }}
            {{- if .Values.server.ollama.bearerToken }}
            - name: OLLAMA_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "chess-potato-ai-3000-web.serverSecretName" . }}
                  key: OLLAMA_BEARER_TOKEN
            {{- end }}
            {{- if .Values.server.feedback.databaseUrl }}
            - name: CPAI3000_FEEDBACK_DATABASE_URL
              value: {{ .Values.server.feedback.databaseUrl | quote }}
            {{- else if .Values.server.persistence.enabled }}
            - name: CPAI3000_FEEDBACK_DATABASE_URL
              value: {{ printf "sqlite:////%s/%s" (trimPrefix "/" .Values.server.persistence.mountPath) .Values.server.feedback.databaseFilename | quote }}
            {{- end }}
            - name: CPAI3000_FEEDBACK_MAX_BYTES
              value: {{ .Values.server.feedback.maxBytes | quote }}
            - name: CPAI3000_FEEDBACK_MAX_HISTORY
              value: {{ .Values.server.feedback.maxHistory | quote }}
            - name: CPAI3000_FEEDBACK_MAX_NOTES
              value: {{ .Values.server.feedback.maxNotes | quote }}
            {{- range $name, $value := .Values.server.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.server.persistence.enabled }}
          volumeMounts:
            - name: server-data
              mountPath: {{ .Values.server.persistence.mountPath }}
              {{- with .Values.server.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- if .Values.server.persistence.enabled }}
      volumes:
        - name: server-data
          persistentVolumeClaim:
            claimName: {{ default (include "chess-potato-ai-3000-web.serverPersistenceName" .) .Values.server.persistence.existingClaim }}
      {{- end }}
