name: Checking Docker Images

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "uci/**"
      - "lichess/**"
      - ".github/workflows/docker-check.yaml"
  pull_request:
    paths:
      - "server/**"
      - "uci/**"
      - "lichess/**"
      - ".github/workflows/docker-check.yaml"

jobs:
  check-server-docker:
    name: Build Server Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha,scope=server-docker
          cache-to: type=gha,mode=max,scope=server-docker

  check-uci-docker:
    name: Build UCI Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build UCI image
        uses: docker/build-push-action@v7
        with:
          context: uci
          file: uci/Dockerfile
          push: false
          cache-from: type=gha,scope=uci-docker
          cache-to: type=gha,mode=max,scope=uci-docker

  check-lichess-docker:
    name: Build Lichess Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build lichess image
        uses: docker/build-push-action@v7
        with:
          context: lichess
          file: lichess/Dockerfile
          push: false
          cache-from: type=gha,scope=lichess-docker
          cache-to: type=gha,mode=max,scope=lichess-docker