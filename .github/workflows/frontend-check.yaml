name: Checking Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-check.yaml"

jobs:
  check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 25
        uses: actions/setup-node@v5
        with:
          node-version: 25

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-check-frontend-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-check-frontend-

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
