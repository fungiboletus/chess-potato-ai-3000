name: Checking UCI Engine

on:
  push:
    branches: [main]
    paths:
      - "uci/**"
      - ".github/workflows/uci-check.yaml"
  pull_request:
    paths:
      - "uci/**"
      - ".github/workflows/uci-check.yaml"

jobs:
  check-uci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uci
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: uci

      - name: Run Pyright
        uses: jakebailey/pyright-action@v2
        with:
          pylance-version: latest-release
          working-directory: uci
          python-path: .venv/bin/python

      - name: Run Tests
        run: uv run pytest
