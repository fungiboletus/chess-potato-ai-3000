name: Docker CI

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".gitmodules"
      - "engines/**"
      - "frontend/**"
      - "server/**"
      - "uci/**"
      - "lichess/**"
      - ".github/workflows/docker-ci.yaml"
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - ".dockerignore"
      - ".gitmodules"
      - "engines/**"
      - "frontend/**"
      - "server/**"
      - "uci/**"
      - "lichess/**"
      - ".github/workflows/docker-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PUSH_IMAGES: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

jobs:
  docker-build:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: frontend
            image_name: chess-potato-ai-3000-frontend
            context: .
            dockerfile: frontend/Dockerfile
          - name: server
            image_name: chess-potato-ai-3000-server
            context: .
            dockerfile: server/Dockerfile
          - name: uci
            image_name: chess-potato-ai-3000-uci
            context: uci
            dockerfile: uci/Dockerfile
          - name: lichess
            image_name: chess-potato-ai-3000-lichess
            context: .
            dockerfile: lichess/Dockerfile
        arch:
          - name: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v6

      - name: Fetch engine submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive \
            engines/chess-potato-random \
            engines/potato-alphabet-3000 \
            engines/Badfish \
            engines/worstfish

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Generate architecture tags
        id: arch-tags
        run: |
          arch_tags=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed '/^$/d; s/$/-${{ matrix.arch.name }}/')
          {
            echo "tags<<EOF"
            printf '%s\n' "$arch_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Define local smoke-test tag
        id: smoke-tag
        if: env.PUSH_IMAGES != 'true'
        run: echo "tag=cpai3000-${{ matrix.image.name }}:${{ matrix.arch.name }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.arch.platform }}
          load: ${{ env.PUSH_IMAGES != 'true' }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: |
            ${{ steps.arch-tags.outputs.tags }}
            ${{ steps.smoke-tag.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}

      - name: Smoke test server health endpoint
        if: env.PUSH_IMAGES != 'true' && matrix.image.name == 'server'
        run: |
          container_name=cpai3000-server-smoke
          docker run -d --rm --name "$container_name" -p 18000:8000 "${{ steps.smoke-tag.outputs.tag }}" >/dev/null
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_name"
          exit 1

      - name: Smoke test frontend root page
        if: env.PUSH_IMAGES != 'true' && matrix.image.name == 'frontend'
        run: |
          container_name=cpai3000-frontend-smoke
          docker run -d --rm --name "$container_name" -p 14173:8080 "${{ steps.smoke-tag.outputs.tag }}" >/dev/null
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:14173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_name"
          exit 1

      - name: Smoke test bundled engine UCI handshakes
        if: env.PUSH_IMAGES != 'true' && matrix.image.name == 'server'
        run: |
          docker run --rm --entrypoint sh "${{ steps.smoke-tag.outputs.tag }}" -lc '
            for bin in \
              /usr/local/bin/chess-potato-ai-3000 \
              /usr/local/bin/chess-potato-random \
              /usr/local/bin/potato-alphabet-3000 \
              /usr/local/bin/badfish \
              /usr/local/bin/worstfish \
              /usr/games/stockfish
            do
              test -x "$bin"
              printf "uci\nquit\n" | "$bin" | grep -m1 "^uciok$" >/dev/null
            done
          '

  docker-manifest:
    name: Publish ${{ matrix.image.name }} manifest
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: frontend
            image_name: chess-potato-ai-3000-frontend
          - name: server
            image_name: chess-potato-ai-3000-server
          - name: uci
            image_name: chess-potato-ai-3000-uci
          - name: lichess
            image_name: chess-potato-ai-3000-lichess

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create and push multi-arch manifest
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done
