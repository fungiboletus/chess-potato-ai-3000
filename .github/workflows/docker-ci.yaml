name: Docker CI

on:
  pull_request:
    paths:
      - "server/**"
      - "uci/**"
      - "lichess/**"
      - ".github/workflows/docker-ci.yaml"
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "server/**"
      - "uci/**"
      - "lichess/**"
      - ".github/workflows/docker-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PUSH_IMAGES: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}

jobs:
  docker-build:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server
            image_name: chess-potato-ai-3000-server
            context: .
            dockerfile: server/Dockerfile
          - name: uci
            image_name: chess-potato-ai-3000-uci
            context: uci
            dockerfile: uci/Dockerfile
          - name: lichess
            image_name: chess-potato-ai-3000-lichess
            context: .
            dockerfile: lichess/Dockerfile
        arch:
          - name: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - name: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Generate architecture tags
        id: arch-tags
        run: |
          arch_tags=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | sed '/^$/d; s/$/-${{ matrix.arch.name }}/')
          {
            echo "tags<<EOF"
            printf '%s\n' "$arch_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.image.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.arch.platform }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.arch-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}

  docker-manifest:
    name: Publish ${{ matrix.image.name }} manifest
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: server
            image_name: chess-potato-ai-3000-server
          - name: uci
            image_name: chess-potato-ai-3000-uci
          - name: lichess
            image_name: chess-potato-ai-3000-lichess

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create and push multi-arch manifest
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done
