<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} | Chess Potato AI 3000</title>
    <meta name="description" content="{{DESCRIPTION_ATTR}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{TITLE_ATTR}} | Chess Potato AI 3000" />
    <meta property="og:description" content="{{DESCRIPTION_ATTR}}" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <style>
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("./fonts/IBM Plex Sans Var-Roman.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }

      @font-face {
        font-family: "IBM Plex Sans";
        src: url("./fonts/IBM Plex Sans Var-Italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }

      :root {
        --bg: #f6f6f6;
        --surface: #ffffff;
        --text: #151515;
        --muted: #4a4a4a;
        --accent: #ffea00;
        --outline: #111111;
        --link: #0d57b3;
        --panel-shadow: 8px 8px 0 var(--outline);
        --button-shadow: 4px 4px 0 var(--outline);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--text);
        background: var(--bg);
        background-image: radial-gradient(circle at 1px 1px, rgb(0 0 0 / 0.14) 1px, transparent 0);
        background-size: 10px 10px;
      }

      .app {
        width: min(980px, 100%);
        margin: 0 auto;
        padding: 18px 14px 80px;
      }

      .topbar,
      .articlePanel {
        border: 3px solid var(--outline);
        box-shadow: var(--panel-shadow);
        background: var(--surface);
      }

      .topbar {
        display: grid;
        gap: 12px;
        align-items: start;
        padding: 12px 14px;
        margin-bottom: 14px;
      }

      .titleBlock h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2.4vw, 2rem);
        line-height: 1.1;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--accent);
        text-shadow: 2px 2px 0 var(--outline);
        -webkit-text-stroke: 1px var(--outline);
      }

      .meta {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 0.88rem;
        color: var(--text);
        font-weight: 700;
      }

      a {
        color: var(--link);
        text-underline-offset: 2px;
      }

      .meta a,
      .quickLinks a {
        font-weight: 800;
      }

      .quickLinks {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 14px;
      }

      .quickLinks a {
        text-decoration: none;
        border: 2px solid var(--outline);
        box-shadow: var(--button-shadow);
        background: var(--accent);
        color: var(--outline);
        padding: 7px 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.78rem;
        font-family: "IBM Plex Sans", sans-serif;
        font-weight: 800;
      }

      .quickLinks a:hover,
      .quickLinks a:focus-visible {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--outline);
      }

      .articlePanel {
        padding: clamp(16px, 2.4vw, 30px);
      }

      .articlePanel > p,
      .articlePanel li,
      .articlePanel blockquote {
        line-height: 1.58;
        font-size: clamp(1rem, 1.2vw, 1.08rem);
      }

      h2,
      h3,
      h4 {
        margin-top: 28px;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      h2 {
        font-size: clamp(1.04rem, 1.9vw, 1.35rem);
      }

      h3 {
        font-size: clamp(0.96rem, 1.5vw, 1.1rem);
      }

      h4 {
        font-size: clamp(0.92rem, 1.35vw, 1rem);
      }

      p code,
      li code {
        padding: 0.12rem 0.34rem;
        border: 1px solid rgb(17 17 17 / 0.22);
        background: rgb(255 234 0 / 0.22);
        font-size: 0.92em;
      }

      pre {
        overflow-x: auto;
        padding: 14px;
        border: 2px solid var(--outline);
        background: #151515;
        color: #f5f5f5;
        box-shadow: 4px 4px 0 rgb(17 17 17 / 0.9);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      pre code {
        border: 0;
        background: transparent;
        padding: 0;
        white-space: inherit;
      }

      .hljs {
        color: #f5f5f5;
      }

      .hljs-comment,
      .hljs-quote {
        color: #9aa0a6;
        font-style: italic;
      }

      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-subst {
        color: #ffea00;
        font-weight: 700;
      }

      .hljs-string,
      .hljs-attr,
      .hljs-selector-attr,
      .hljs-selector-class,
      .hljs-template-variable {
        color: #97e48a;
      }

      .hljs-number,
      .hljs-literal,
      .hljs-variable,
      .hljs-symbol,
      .hljs-bullet {
        color: #ffb870;
      }

      .hljs-title,
      .hljs-title.class_,
      .hljs-title.function_,
      .hljs-function,
      .hljs-section {
        color: #7fc8ff;
      }

      .hljs-built_in,
      .hljs-type,
      .hljs-class,
      .hljs-tag,
      .hljs-name {
        color: #ff8f8f;
      }

      .hljs-meta,
      .hljs-meta .hljs-keyword,
      .hljs-doctag {
        color: #c9a7ff;
      }

      blockquote {
        margin: 18px 0;
        padding: 12px 16px;
        border-left: 6px solid var(--accent);
        background: rgb(255 234 0 / 0.16);
      }

      img {
        width: auto;
        max-width: min(100%, 760px);
        max-height: min(72vh, 820px);
        height: auto;
        display: block;
      }

      .articlePanel > p img,
      .articlePanel > a img,
      .articlePanel img:not([style*="float:left"]) {
        margin-inline: auto;
      }

      .articlePanel img[src$="art.apng"] {
        width: 32px;
      }

      figure {
        margin: 18px 0;
        text-align: center;
      }

      figcaption {
        margin-top: 8px;
        font-size: 0.93rem;
        color: var(--muted);
        font-style: italic;
      }

      ul,
      ol {
        padding-left: 1.4rem;
      }

      hr {
        border: 0;
        border-top: 2px solid rgb(17 17 17 / 0.18);
        margin: 28px 0;
      }

      .articlePanel > p:first-of-type::first-letter {
        font-weight: 700;
      }

      @media (max-width: 700px) {
        .app {
          padding-inline: 12px;
        }

        img,
        .articlePanel img:not([style*="float:left"]) {
          width: 100%;
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="titleBlock">
          <h1>{{DISPLAY_TITLE}}</h1>
          <div class="meta">
            <span>{{AUTHOR}}</span>
            <span>{{PUBLISHED_DATE}}</span>
            <a href="{{REPOSITORY_URL}}">GitHub Repository</a>
            <a href="{{LICENSE_URL}}">CC BY-SA 4.0</a>
          </div>
        </div>
      </header>

      <nav class="quickLinks" aria-label="Page links">
        <a href="{{APP_URL}}">Open App</a>
        <a href="{{REPOSITORY_URL}}">Source Code</a>
        <a href="https://lichess.org/@/nittedal">Play on Lichess</a>
      </nav>

      <article class="articlePanel">
{{CONTENT}}
      </article>
    </main>
  </body>
</html>
