<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} | Chess Potato AI 3000</title>
    <meta name="description" content="{{DESCRIPTION_ATTR}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{TITLE_ATTR}} | Chess Potato AI 3000" />
    <meta property="og:description" content="{{DESCRIPTION_ATTR}}" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <style>
      :root {
        --bg: #f3efe3;
        --surface: #fffdf8;
        --surface-alt: #fff3d1;
        --text: #1c1a17;
        --muted: #5d5547;
        --accent: #c4602e;
        --accent-strong: #8b2f16;
        --outline: #1c1a17;
        --link: #0e4e84;
        --panel-shadow: 8px 8px 0 var(--outline);
        --button-shadow: 4px 4px 0 var(--outline);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgb(255 244 214 / 0.92), transparent 32%),
          repeating-linear-gradient(
            135deg,
            rgb(196 96 46 / 0.08),
            rgb(196 96 46 / 0.08) 12px,
            transparent 12px,
            transparent 26px
          ),
          var(--bg);
      }

      .app {
        width: min(1040px, 100%);
        margin: 0 auto;
        padding: 18px 14px 80px;
      }

      .topbar,
      .articlePanel {
        border: 3px solid var(--outline);
        box-shadow: var(--panel-shadow);
        background: var(--surface);
      }

      .topbar {
        display: grid;
        gap: 14px;
        align-items: start;
        padding: 16px;
        margin-bottom: 14px;
        background:
          linear-gradient(135deg, var(--surface-alt), var(--surface));
      }

      .titleBlock h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        line-height: 1.05;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--accent-strong);
        text-shadow: 2px 2px 0 rgb(255 245 220 / 0.9);
      }

      .meta {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 0.92rem;
        color: var(--text);
        font-weight: 700;
      }

      a {
        color: var(--link);
        text-underline-offset: 2px;
      }

      .meta a,
      .quickLinks a {
        font-weight: 800;
      }

      .quickLinks {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 14px;
      }

      .quickLinks a {
        text-decoration: none;
        border: 2px solid var(--outline);
        box-shadow: var(--button-shadow);
        background: var(--accent);
        color: #fff7ef;
        padding: 7px 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.78rem;
        font-family: Arial, sans-serif;
        font-weight: 800;
      }

      .quickLinks a:hover,
      .quickLinks a:focus-visible {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--outline);
      }

      .articlePanel {
        padding: clamp(18px, 2.5vw, 34px);
      }

      .articlePanel > p,
      .articlePanel li,
      .articlePanel blockquote {
        line-height: 1.68;
        font-size: clamp(1rem, 1.15vw, 1.1rem);
      }

      .articlePanel > p:first-of-type::first-letter {
        float: left;
        font-size: 3.2rem;
        line-height: 0.9;
        padding-right: 8px;
        color: var(--accent-strong);
        font-weight: 700;
      }

      h2,
      h3,
      h4 {
        margin-top: 30px;
        margin-bottom: 12px;
        font-family: Arial, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      h2 {
        font-size: clamp(1.08rem, 1.95vw, 1.42rem);
      }

      h3 {
        font-size: clamp(0.98rem, 1.5vw, 1.14rem);
      }

      p code,
      li code {
        padding: 0.12rem 0.34rem;
        border: 1px solid rgb(28 26 23 / 0.25);
        background: rgb(255 243 209 / 0.7);
        font-size: 0.92em;
      }

      pre {
        overflow-x: auto;
        padding: 14px;
        border: 2px solid var(--outline);
        background: #1e1c18;
        color: #f6ead2;
        box-shadow: 4px 4px 0 rgb(28 26 23 / 0.8);
      }

      pre code {
        border: 0;
        background: transparent;
        padding: 0;
      }

      blockquote {
        margin: 18px 0;
        padding: 12px 16px;
        border-left: 6px solid var(--accent);
        background: rgb(255 243 209 / 0.55);
      }

      img {
        width: auto;
        max-width: min(100%, 860px);
        height: auto;
        display: block;
      }

      .articlePanel > p img,
      .articlePanel > a img,
      .articlePanel img:not([style*="float:left"]) {
        margin-inline: auto;
      }

      figure {
        margin: 18px 0;
        text-align: center;
      }

      figcaption {
        margin-top: 8px;
        font-size: 0.93rem;
        color: var(--muted);
        font-style: italic;
      }

      ul,
      ol {
        padding-left: 1.4rem;
      }

      hr {
        border: 0;
        border-top: 2px solid rgb(28 26 23 / 0.18);
        margin: 28px 0;
      }

      @media (max-width: 700px) {
        .app {
          padding-inline: 12px;
        }

        img,
        .articlePanel img:not([style*="float:left"]) {
          width: 100%;
          max-width: 100%;
        }

        .articlePanel > p:first-of-type::first-letter {
          font-size: 2.6rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="titleBlock">
          <h1>{{TITLE}}</h1>
          <div class="meta">
            <span>{{AUTHOR}}</span>
            <span>{{PUBLISHED_DATE}}</span>
            <a href="{{REPOSITORY_URL}}">GitHub Repository</a>
            <a href="{{LICENSE_URL}}">CC BY-SA 4.0</a>
          </div>
        </div>
      </header>

      <nav class="quickLinks" aria-label="Page links">
        <a href="{{APP_URL}}">Open App</a>
        <a href="{{REPOSITORY_URL}}">Source Code</a>
        <a href="https://lichess.org/@/nittedal">Play on Lichess</a>
      </nav>

      <article class="articlePanel">
{{CONTENT}}
      </article>
    </main>
  </body>
</html>
